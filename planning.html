<style>
:root{--red:#C41E3A;--dark:#F4F5F7;--dark2:#FFFFFF;--border:rgba(18,22,30,0.16);--text:#101216;--text2:rgba(16,18,22,0.84);--text3:rgba(16,18,22,0.70);--font:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--dark);color:var(--text);font-family:var(--font)}
body{padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:1280px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}

.brand .name{font-weight:800;font-size:15px}

.today-date{font-size:15px;font-weight:800;color:var(--text);text-align:center;flex:1}

.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text3);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.live.off i{background:#d97706;box-shadow:0 0 0 3px rgba(217,119,6,.18)}
.box{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:18px 20px 20px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}

.ctrls{display:flex;align-items:center;gap:8px}
.nav{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--dark2);color:var(--text);font-size:20px;font-weight:700;cursor:pointer;line-height:1;font-family:inherit}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}

.ev .t i{font-style:normal;font-weight:700;color:#92400e;flex-shrink:0}
.ev .s{font-size:11px;color:var(--text2)}
.list{display:none}

.day:first-child{border-top:none}

.foot{text-align:center;font-size:12px;color:var(--text3);margin-top:12px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--dark2);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;width:max-content;max-width:100%}
.tabs button{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--text3);padding:8px 16px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--red);color:#fff}
.ev.vt{background:rgba(196,30,58,.10)}
.ev.vid{background:rgba(37,99,235,.10)}
.ev .k{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.ev.vt .k{color:#9B1830}.ev.vid .k{color:#1D4ED8}
.card.vt{background:rgba(196,30,58,.07);border-color:rgba(196,30,58,.22)}
.card.vid{background:rgba(37,99,235,.07);border-color:rgba(37,99,235,.22)}
.card .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.card.vt .k{color:#9B1830}.card.vid .k{color:#1D4ED8}
/* ★ LOT 49 — Téléphone : toujours le calendrier EN GRILLE (comme dans le
   logiciel). Il se lit le mieux téléphone tenu à l'horizontale. */
.list{display:none}
/* Téléphone à l'horizontale : grille compacte, tout tient à l'écran. */
@media (max-height:520px) and (orientation:landscape), (max-width:600px){
  body{padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 10px calc(env(safe-area-inset-left,0px) + 10px)}
  .top{margin-bottom:6px}
  .brand img{height:20px}.brand .name{font-size:13px}.brand .sub{display:none}
  .today-date{font-size:13px}.today-date small{display:none}
  .tabs{padding:3px;margin-bottom:6px}.tabs button{padding:5px 12px;font-size:12.5px}
  .top{flex-wrap:nowrap}
  .box{padding:8px 10px 10px;border-radius:12px}
  .head{margin-bottom:6px;flex-wrap:nowrap}
  .title{font-size:13px}.title span{font-size:11px}
  .nav,.today-btn{height:30px}.nav{width:30px;font-size:17px}.today-btn{font-size:12px;padding:0 9px}
  .month{min-width:110px;font-size:13px}
  .grid{gap:3px}
  .dow{font-size:9.5px;padding:0 3px}
  .cell{min-height:58px;padding:3px;gap:3px;border-radius:6px}
  .num{font-size:10.5px}.num em{font-size:9px}
  .ev{padding:3px 4px;border-radius:5px}
  .ev .t{font-size:10px;flex-wrap:wrap;column-gap:4px;row-gap:0}.ev .s{font-size:9px}.ev .k{font-size:8px}
  .ev .t b{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2}
  .ev span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2}
  .foot{display:none}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="msg"><p>Chargement du calendrier…</p></div>
</div>
<script>
(function () {
  'use strict';
  var MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var DOW = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  var code = new URLSearchParams(location.search).get('code') || '';
  var data = null, lastOk = null, failed = false;
  var view = (location.hash === '#entretien') ? 'maint' : 'returns'; // ★ LOT 49 : onglet affiché
  var now = new Date();
  var ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  /* Plaque · couleur : même règle que le logiciel (aslVehPlateColor). */
  function plateColor(r) {
    var car = (data.fleet || []).filter(function (c) { return String(c.id) === String(r.carId); })[0]
           || (data.fleet || []).filter(function (c) { return c.name === r.car; })[0];
    var units = (car && car.units) || [];
    var plate = r.plate, color = r.color;
    if (plate) {
      if (!color) { var u = units.filter(function (x) { return x.plate === plate; })[0]; if (u) color = u.color; }
    } else if (units.length === 1 && units[0].plate) {
      plate = units[0].plate; color = color || units[0].color;
    } else if (r.status === 'confirmed' || r.status === 'pending') {
      return 'Plaque attribuée à la prise en charge';
    }
    return plate ? plate + (color ? ' · ' + color : '') : (color || '');
  }
  function returnsOn(d) {
    return (data.returns || []).filter(function (r) { return r.endDate === d; })
      .sort(function (a, b) { return String(a.endTime || '').localeCompare(String(b.endTime || '')); });
  }
  function shift(delta) {
    var y = parseInt(ym.slice(0, 4), 10), m = parseInt(ym.slice(5, 7), 10) + delta;
    if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
    ym = y + '-' + String(m).padStart(2, '0'); render();
  }
  window.__aslShift = shift;
  window.__aslView = function (v) { view = v; try { history.replaceState(null, '', v === 'maint' ? '#entretien' : '#retours'); } catch (e) {} render(); };
  /* ★ LOT 49 — Échéances d'entretien d'un jour (VT + vérification vidange). */
  function maintOn(d) {
    var out = [];
    (data.maint || []).forEach(function (m) {
      var sub = (m.plate || '') + (m.color ? ' · ' + m.color : '');
      if (m.vt === d) out.push({ kind: 'vt', label: 'Visite technique', car: m.car, sub: sub });
      if (m.vidange === d) out.push({ kind: 'vid', label: 'Vérification vidange' + (m.kmVidange ? ' (' + Number(m.kmVidange).toLocaleString('fr-FR') + ' km)' : ''), car: m.car, sub: sub });
    });
    return out;
  }
  window.__aslToday = function () { var n = new Date(); ym = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0'); render(); };
  function message(title, text) {
    document.getElementById('app').innerHTML = '<div class="msg"><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p></div>';
  }
  function render() {
    if (!data) return;
    var today = iso(new Date());
    var y = parseInt(ym.slice(0, 4), 10), mo = parseInt(ym.slice(5, 7), 10);
    var daysIn = new Date(y, mo, 0).getDate();
    var lead = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
    var total = 0, grid = '', list = '', nVt = 0, nVid = 0;
    ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(function (d) { grid += '<div class="dow">' + d + '</div>'; });
    for (var i = 0; i < lead; i++) grid += '<div class="cell out"></div>';
    for (var day = 1; day <= daysIn; day++) {
      var d = ym + '-' + String(day).padStart(2, '0');
      if (view === 'maint') {
        var ms = maintOn(d); total += ms.length;
        ms.forEach(function (e) { if (e.kind === 'vt') nVt++; else nVid++; });
        grid += '<div class="cell' + (d === today ? ' today' : '') + (d < today ? ' past' : '') + '"><div class="num"><span>' + day + '</span></div>'
          + ms.map(function (e) {
              return '<div class="ev ' + e.kind + '"><span class="k">' + esc(e.label) + '</span><span class="t"><b>' + esc(e.car) + '</b></span>' + (e.sub ? '<span class="s">' + esc(e.sub) + '</span>' : '') + '</div>';
            }).join('') + '</div>';
        if (ms.length) {
          var dtm = new Date(y, mo - 1, day);
          list += '<div class="day' + (d === today ? ' is-today' : '') + '"><div class="dayh"><span>' + DOW[dtm.getDay()] + ' ' + day + ' ' + MONTHS[mo - 1].toLowerCase() + (d === today ? ' · aujourd\'hui' : '') + '</span></div>'
            + ms.map(function (e) {
                return '<div class="card ' + e.kind + '"><div class="k">' + esc(e.label) + '</div><div class="t"><span>' + esc(e.car) + '</span></div>' + (e.sub ? '<div class="s">' + esc(e.sub) + '</div>' : '') + '</div>';
              }).join('') + '</div>';
        }
        continue;
      }
      var rs = returnsOn(d); total += rs.length;
      grid += '<div class="cell' + (d === today ? ' today' : '') + (d < today ? ' past' : '') + '"><div class="num"><span>' + day + '</span>'
        + (rs.length ? '<em>' + rs.length + ' retour' + (rs.length > 1 ? 's' : '') + '</em>' : '') + '</div>'
        + rs.map(function (r) {
            var pc = plateColor(r);
            return '<div class="ev"><span class="t"><b>' + esc(r.car || 'Véhicule') + '</b>' + (r.endTime ? '<i>' + esc(r.endTime) + '</i>' : '') + '</span>'
              + (pc ? '<span class="s">' + esc(pc) + '</span>' : '')
              + '<span class="s">' + esc(r.client || '') + '</span>'
              + (r.place ? '<span class="s">' + esc(r.place) + '</span>' : '') + '</div>';
          }).join('') + '</div>';
      if (rs.length) {
        var dt = new Date(y, mo - 1, day);
        list += '<div class="day' + (d === today ? ' is-today' : '') + '"><div class="dayh"><span>' + DOW[dt.getDay()] + ' ' + day + ' ' + MONTHS[mo - 1].toLowerCase() + (d === today ? ' · aujourd\'hui' : '') + '</span><em>' + rs.length + ' retour' + (rs.length > 1 ? 's' : '') + '</em></div>'
          + rs.map(function (r) {
              var pc = plateColor(r);
              return '<div class="card"><div class="t"><span>' + esc(r.car || 'Véhicule') + '</span>' + (r.endTime ? '<i>' + esc(r.endTime) + '</i>' : '') + '</div>'
                + (pc ? '<div class="s">' + esc(pc) + '</div>' : '')
                + '<div class="s">' + esc(r.client || '') + '</div>'
                + (r.place ? '<div class="s">' + esc(r.place) + '</div>' : '') + '</div>';
            }).join('') + '</div>';
      }
    }
    var trail = (7 - ((lead + daysIn) % 7)) % 7;
    for (var j = 0; j < trail; j++) grid += '<div class="cell out"></div>';
    var isCurrent = ym === today.slice(0, 7);
    var upd = lastOk ? lastOk.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
    document.getElementById('app').innerHTML =
      '<div class="top"><div class="brand"><img src="/assets/logo-asl-admin.png" alt="All Star Loc" onerror="this.style.display=\'none\'"><div><div class="name">All Star Loc</div><div class="sub">Calendriers · retours et entretien</div></div></div>'
      + '<div class="today-date"><small>Aujourd\'hui</small>' + DOW[new Date().getDay()].charAt(0).toUpperCase() + DOW[new Date().getDay()].slice(1) + ' ' + new Date().getDate() + ' ' + MONTHS[new Date().getMonth()].toLowerCase() + ' ' + new Date().getFullYear() + '</div>'
      + '<div class="live' + (failed ? ' off' : '') + '"><i></i>' + (failed ? 'Connexion perdue — nouvelle tentative…' : 'À jour' + (upd ? ' · ' + upd : '')) + '</div></div>'
      + '<div class="tabs"><button class="' + (view === 'returns' ? 'on' : '') + '" onclick="__aslView(\'returns\')">Retours</button><button class="' + (view === 'maint' ? 'on' : '') + '" onclick="__aslView(\'maint\')">Entretien</button></div>'
      + '<div class="box"><div class="head">'
      + '<div class="title"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
      + (view === 'maint'
          ? 'Échéances d\'entretien <span>· ' + nVt + ' visite' + (nVt > 1 ? 's' : '') + ' technique' + (nVt > 1 ? 's' : '') + ' · ' + nVid + ' vidange' + (nVid > 1 ? 's' : '') + '</span>'
          : 'Calendrier des retours <span>· ' + total + ' retour' + (total > 1 ? 's' : '') + ' prévu' + (total > 1 ? 's' : '') + '</span>')
      + '</div>'
      + '<div class="ctrls"><button class="nav" onclick="__aslShift(-1)" aria-label="Mois précédent">‹</button><div class="month">' + MONTHS[mo - 1] + ' ' + y + '</div><button class="nav" onclick="__aslShift(1)" aria-label="Mois suivant">›</button>'
      + (isCurrent ? '' : '<button class="today-btn" onclick="__aslToday()">Ce mois-ci</button>') + '</div></div>'
      + '<div class="grid">' + grid + '</div>'
      + '<div class="list">' + (list || '<div class="empty">' + (view === 'maint' ? 'Aucune visite technique ni vidange ce mois-ci.' : 'Aucun retour prévu ce mois-ci.') + '</div>') + '</div>'
      + '</div><div class="foot">Mis à jour automatiquement</div>';
  }
  function load() {
    if (!code) { message('Lien incomplet', 'Ce lien ne contient pas de code. Demandez le lien complet.'); return; }
    fetch('/api/share/planning?code=' + encodeURIComponent(code), { cache: 'no-store' })
      .then(function (res) {
        if (res.status === 404) { data = null; message('Lien désactivé', 'Ce lien n\'est plus actif. Demandez un nouveau lien.'); return null; }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (j) {
        if (!j) return;
        data = j; lastOk = new Date(); failed = false; render();
      })
      .catch(function () { failed = true; if (data) render(); else message('Connexion impossible', 'Vérifiez la connexion internet. Nouvelle tentative automatique…'); });
  }
  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(); });
  window.addEventListener('focus', load);
})();
</script>
</body>
</html>
